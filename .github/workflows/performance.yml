name: Performance Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-smoke
  cancel-in-progress: true

env:
  UV_VERSION: 0.8.22
  APP_ENV: test
  AUTH_MODE: development
  DATABASE_URL: postgresql+psycopg://eca_app:ci_app_password@127.0.0.1:5432/enterprise_analytics
  QUERY_DATABASE_URL: postgresql+psycopg://eca_reader:ci_reader_password@127.0.0.1:5432/enterprise_analytics
  SESSION_STORE_BACKEND: redis
  SESSION_REDIS_URL: redis://127.0.0.1:6379/0
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
  RATE_LIMIT_REQUESTS: 10000
  PERFORMANCE_ALLOW_LIVE_LLM: "false"
  PERFORMANCE_COMMIT_SHA: ${{ github.sha }}
  PERFORMANCE_DATASET: synthetic-default-seed
  PERFORMANCE_DATASET_SIZE: facilities=12,providers=80,members=500,encounters=3000,claims=2500,appointments=1500

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: enterprise_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_analytics"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked performance dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Bootstrap database roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec --env POSTGRES_DB=enterprise_analytics --env POSTGRES_USER=postgres \
            --env POSTGRES_APP_USER=eca_app --env POSTGRES_APP_PASSWORD=ci_app_password \
            --env POSTGRES_READER_USER=eca_reader --env POSTGRES_READER_PASSWORD=ci_reader_password \
            "$POSTGRES_CONTAINER_ID" bash -s < docker/postgres/init/001-create-roles.sh
      - name: Migrate and seed synthetic data
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.db.seed
      - name: Start deterministic FakeLLM target
        working-directory: backend
        run: |
          uv run uvicorn performance.fake_app:app --host 127.0.0.1 --port 8000 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/api/health
      - name: Run bounded Locust smoke profile
        working-directory: backend
        run: |
          mkdir -p ../artifacts/performance/runs/ci-smoke
          uv run locust -f performance/locustfile.py --headless --host http://127.0.0.1:8000 \
            --users 2 --spawn-rate 1 --run-time 15s --only-summary \
            --csv ../artifacts/performance/runs/ci-smoke/locust
          uv run python -m performance.report --profile smoke \
            --stats ../artifacts/performance/runs/ci-smoke/locust_stats.csv \
            --output ../artifacts/performance/runs/ci-smoke
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-smoke
          path: artifacts/performance/runs/ci-smoke/
          retention-days: 14
          if-no-files-found: error
