name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.8.22

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend development dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Run Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Check Ruff formatting
        working-directory: backend
        run: uv run ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH_MODE: development
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend development dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Run network-free backend tests
        working-directory: backend
        run: uv run pytest -m "not integration and not live_llm"

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://eca_app:ci_app_password@127.0.0.1:5432/enterprise_analytics
      TEST_DATABASE_URL: postgresql+psycopg://eca_app:ci_app_password@127.0.0.1:5432/enterprise_analytics
      QUERY_DATABASE_URL: postgresql+psycopg://eca_reader:ci_reader_password@127.0.0.1:5432/enterprise_analytics
      QUERY_TEST_DATABASE_URL: postgresql+psycopg://eca_reader:ci_reader_password@127.0.0.1:5432/enterprise_analytics
      SESSION_STORE_BACKEND: redis
      SESSION_REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: enterprise_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend development dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Bootstrap PostgreSQL application and reader roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec \
            --env POSTGRES_DB=enterprise_analytics \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_APP_USER=eca_app \
            --env POSTGRES_APP_PASSWORD=ci_app_password \
            --env POSTGRES_READER_USER=eca_reader \
            --env POSTGRES_READER_PASSWORD=ci_reader_password \
            "$POSTGRES_CONTAINER_ID" bash -s < docker/postgres/init/001-create-roles.sh
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Seed deterministic synthetic data
        working-directory: backend
        run: uv run python -m app.db.seed
      - name: Run PostgreSQL and Redis integration tests
        working-directory: backend
        run: uv run pytest -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  offline-evaluation:
    name: Offline Evaluation
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH_MODE: development
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run offline evaluation gate
        working-directory: backend
        run: uv run python -m app.evaluation.run --profile offline
      - name: Upload offline evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-evaluation-reports
          path: backend/artifacts/evaluation/runs/
          if-no-files-found: ignore
          retention-days: 7

  integration-evaluation:
    name: Integration Evaluation
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://eca_app:ci_app_password@127.0.0.1:5432/enterprise_analytics
      TEST_DATABASE_URL: postgresql+psycopg://eca_app:ci_app_password@127.0.0.1:5432/enterprise_analytics
      QUERY_DATABASE_URL: postgresql+psycopg://eca_reader:ci_reader_password@127.0.0.1:5432/enterprise_analytics
      QUERY_TEST_DATABASE_URL: postgresql+psycopg://eca_reader:ci_reader_password@127.0.0.1:5432/enterprise_analytics
      SESSION_STORE_BACKEND: redis
      SESSION_REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: enterprise_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Bootstrap PostgreSQL application and reader roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec \
            --env POSTGRES_DB=enterprise_analytics \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_APP_USER=eca_app \
            --env POSTGRES_APP_PASSWORD=ci_app_password \
            --env POSTGRES_READER_USER=eca_reader \
            --env POSTGRES_READER_PASSWORD=ci_reader_password \
            "$POSTGRES_CONTAINER_ID" bash -s < docker/postgres/init/001-create-roles.sh
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Seed deterministic synthetic data
        working-directory: backend
        run: uv run python -m app.db.seed
      - name: Run integration evaluation gate
        working-directory: backend
        run: uv run python -m app.evaluation.run --profile integration
      - name: Upload integration evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-evaluation-reports
          path: backend/artifacts/evaluation/runs/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker Build
    needs: [backend-quality, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export frozen Python runtime dependencies
        working-directory: backend
        run: >-
          uv export --quiet --frozen --no-dev --no-emit-project
          --format requirements-txt
          --output-file "$RUNNER_TEMP/backend-requirements.txt"
      - name: Audit Python runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement "$RUNNER_TEMP/backend-requirements.txt"
          --progress-spinner off
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production npm dependencies at high severity
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-smoke:
    name: Container Smoke
    if: github.event_name != 'pull_request'
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start and wait for the local integration stack
        run: docker compose --env-file .env.docker.example up -d --build --wait
      - name: Verify frontend, health, and development auth
        run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/
          test "$(curl --fail --silent --show-error http://127.0.0.1:5173/api/health)" = '{"status":"ok"}'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/api/auth/me
      - name: Show service status on failure
        if: failure()
        run: docker compose --env-file .env.docker.example ps --all
      - name: Stop stack without deleting named volumes
        if: always()
        run: docker compose --env-file .env.docker.example down
