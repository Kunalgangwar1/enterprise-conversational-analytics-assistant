[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-conversational-analytics-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Conversational Analytics Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "faker>=30,<40",
    "fastapi>=0.115,<1.0",
    "google-genai>=2.23.0",
    "lancedb>=0.38.0",
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "opentelemetry-api>=1.29,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
    "opentelemetry-sdk>=1.29,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=25,<40",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "locust==2.46.7",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "integration: requires an explicitly configured isolated PostgreSQL test database",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
