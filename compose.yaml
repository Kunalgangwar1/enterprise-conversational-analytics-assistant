name: eca-local

x-backend-environment: &backend-environment
  APP_ENV: development
  AUTH_MODE: development
  AUTH_DEV_SUBJECT: local-docker-user
  AUTH_DEV_EMAIL: developer@example.invalid
  AUTH_DEV_DISPLAY_NAME: Local Docker Developer
  AUTH_DEV_ROLES: analyst
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  LOG_LEVEL: INFO
  ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
  CORS_ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}","http://127.0.0.1:${FRONTEND_PORT:-5173}"]'
  CORS_ALLOW_CREDENTIALS: "true"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "false"
  API_DOCS_ENABLED: "true"
  SESSION_COOKIE_SECURE: "false"
  SESSION_STORE_BACKEND: redis
  SESSION_REDIS_URL: redis://redis:6379/0
  SESSION_REDIS_KEY_PREFIX: eca:session
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REDIS_URL: redis://redis:6379/1
  RATE_LIMIT_REDIS_KEY_PREFIX: eca:rate
  DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:?set POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  QUERY_DATABASE_URL: postgresql+psycopg://${POSTGRES_READER_USER:?set POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  KNOWLEDGE_CATALOG_DIR: /app/backend/data/knowledge_catalog
  DATA_QUALITY_DIR: /app/backend/data/data_quality
  ARTIFACTS_OUTPUT_DIR: /app/backend/artifacts

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:?set POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  migrate:
    image: eca-backend:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: eca-backend:local
    profiles: ["seed"]
    restart: "no"
    command: ["python", "-m", "app.db.seed"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: eca-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "on-failure:3"
    init: true
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); assert json.load(response) == {'status': 'ok'}",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: eca-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ""
    restart: "on-failure:3"
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
